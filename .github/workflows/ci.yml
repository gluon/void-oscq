name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  budgets:
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # PRD 10 budgets that need no window; the real binary test needs a display and is run by hand.
      - name: Budgets in process, release build
        run: cargo test --release --locked --workspace -- --ignored budget_ --nocapture --test-threads=1

      - name: Release binary size
        shell: bash
        run: |
          cargo build --release --locked -p void-oscq
          ./ci/binary-size.sh target/release/void-oscq${{ runner.os == 'Windows' && '.exe' || '' }}

  real-binary:
    name: real binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # PRD 6.2: the real window must not repaint when idle. Linux runs it under Xvfb.
      - name: Real binary does not repaint when idle
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          $run cargo test --release --locked -p void-oscq --test budgets_binary -- --ignored --exact real_binary_does_not_repaint_when_idle --nocapture

      # Numbers for docs/decisions.md from a CI machine, not the human's; a measurement, not a gate.
      - name: Real binary budgets, measurement only
        continue-on-error: true
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          $run cargo test --release --locked -p void-oscq --test budgets_binary -- --ignored real_binary_ --nocapture --test-threads=1

  guards:
    name: guards
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: No egui or eframe in the protocol crates
        run: ./ci/check-ui-isolation.sh

      - name: No em dash in tracked files
        run: ./ci/check-no-em-dash.sh

      - name: No conflict markers in tracked files
        run: ./ci/check-no-conflict-markers.sh

      - name: The font license texts are those of the fonts in the binary
        run: ./ci/check-licenses.sh
