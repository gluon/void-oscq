[package]
name = "oscq-core"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false

[dependencies]
flume.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = "0.13.5"
rosc = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
