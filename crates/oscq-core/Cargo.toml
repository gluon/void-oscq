[package]
name = "oscq-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = "0.13.5"
rosc = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"

[lints]
workspace = true
